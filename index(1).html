<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Skin Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101321;color:#fff;font-family:Arial,sans-serif}
h1{text-align:center;color:#a99aff}
.panel{background:#20263b;padding:14px;border-radius:14px;margin:12px 0}
label{display:block;margin:12px 0}
button,select,input{padding:10px;border:0;border-radius:8px;margin:4px;max-width:100%}
button{background:#7866ed;color:white;font-weight:bold}
canvas{display:block;width:100%;max-width:340px;height:auto;margin:14px auto;background:#171b2b;border:2px solid #777;image-rendering:pixelated;touch-action:none}
.tools{display:flex;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<h1>GD Skin Studio</h1>
<div class="panel">
<label>Режим:
<select id="mode">
<option>Cube</option><option>Ship</option><option>Ball</option><option>UFO</option>
<option>Wave</option><option>Robot</option><option>Spider</option><option>Swing</option>
</select></label>
<label>Цвет: <input type="color" id="color" value="#8b5cf6"></label>
<label>Размер кисти: <input type="range" id="size" min="1" max="16" value="4"></label>
<label>Ориентир (PNG/JPG): <input type="file" id="reference" accept="image/*"></label>
<label>Прозрачность ориентира: <input type="range" id="opacity" min="0" max="100" value="35"></label>
</div>
<div class="panel">
<div class="tools">
<button id="clear">Очистить рисунок</button>
<button id="download">Скачать PNG</button>
</div>
<canvas id="canvas" width="320" height="320"></canvas>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let drawing=false,reference=null,strokes=[];
function redraw(){
 ctx.clearRect(0,0,320,320);
 if(reference){ctx.globalAlpha=Number(document.getElementById('opacity').value)/100;ctx.drawImage(reference,0,0,320,320);ctx.globalAlpha=1;}
 for(const s of strokes){ctx.fillStyle=s.color;ctx.fillRect(s.x,s.y,s.size,s.size);}
}
function point(e){
 const r=canvas.getBoundingClientRect();
 return {x:Math.max(0,Math.min(319,Math.floor((e.clientX-r.left)*320/r.width))),y:Math.max(0,Math.min(319,Math.floor((e.clientY-r.top)*320/r.height)))};
}
function paint(e){
 if(!drawing)return;
 const p=point(e),size=Number(document.getElementById('size').value);
 strokes.push({x:Math.floor(p.x/size)*size,y:Math.floor(p.y/size)*size,size,color:document.getElementById('color').value});
 redraw();
}
canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);paint(e);});
canvas.addEventListener('pointermove',paint);
canvas.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('pointercancel',()=>drawing=false);
document.getElementById('clear').addEventListener('click',()=>{strokes=[];redraw();});
document.getElementById('download').addEventListener('click',()=>{
 const out=document.createElement('canvas');out.width=320;out.height=320;const o=out.getContext('2d');
 for(const s of strokes){o.fillStyle=s.color;o.fillRect(s.x,s.y,s.size,s.size);}
 const a=document.createElement('a');a.download='gd-skin.png';a.href=out.toDataURL('image/png');a.click();
});
document.getElementById('reference').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;const img=new Image();
 img.onload=()=>{reference=img;redraw();URL.revokeObjectURL(img.src);};img.src=URL.createObjectURL(file);
});
document.getElementById('opacity').addEventListener('input',redraw);
redraw();
</script>
</body>
</html>
