<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD Skin Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(145deg,#11152b,#25134a);color:#f5f3ff;font:16px system-ui}
main{max-width:760px;margin:auto}.card{background:#1b2035;border:1px solid #ffffff25;border-radius:18px;padding:16px;margin:14px 0}
p,small{color:#c9c4df}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.file{background:#8b5cf6;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:700}
input[type=color]{width:48px;height:42px;background:none;border:0}canvas{width:100%;max-width:512px;aspect-ratio:1;background:#fff;border-radius:12px;display:block;margin:12px auto;touch-action:none}
label{display:inline-flex;align-items:center;gap:7px;margin:5px}
</style></head><body><main>
<h1>GD Skin Studio</h1><p>Создай собственный пиксельный скин Geometry Dash.</p>
<section class="card">
<div class="tools"><label>Цвет <input id="color" type="color" value="#35d7ff"></label>
<label>Размер <input id="size" type="range" min="4" max="32" value="16"></label>
<button id="clear">Очистить</button></div>
<canvas id="paint" width="512" height="512"></canvas>
<div class="tools">
<label class="file">Загрузить ориентир <input id="reference" type="file" accept="image/*" hidden></label>
<label>Прозрачность <input id="opacity" type="range" min="0" max="100" value="35"></label>
<button id="save">Скачать PNG</button></div>
<small>Ориентир служит полупрозрачным фоном и не попадёт в экспортированный PNG.</small>
</section></main>
<script>
const c=document.getElementById('paint'),ctx=c.getContext('2d');
const color=document.getElementById('color'),size=document.getElementById('size');let drawing=false,ref=null;
function redraw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,512,512);if(ref){ctx.globalAlpha=Number(document.getElementById('opacity').value)/100;ctx.drawImage(ref,0,0,512,512);ctx.globalAlpha=1;}}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*512/r.width,y:(e.clientY-r.top)*512/r.height}}
function paint(e){if(!drawing)return;const p=pos(e),s=Number(size.value);ctx.fillStyle=color.value;ctx.fillRect(Math.floor(p.x/s)*s,Math.floor(p.y/s)*s,s,s)}
c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);paint(e)});
c.addEventListener('pointermove',paint);c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false);
document.getElementById('clear').onclick=redraw;
document.getElementById('reference').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{ref=img;redraw()};img.src=URL.createObjectURL(f)};
document.getElementById('opacity').oninput=redraw;
document.getElementById('save').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=512;out.getContext('2d').drawImage(c,0,0);const a=document.createElement('a');a.download='my-gd-skin.png';a.href=out.toDataURL('image/png');a.click()};
redraw();
</script></body></html>
