
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Skin Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:18px;
 background:#10111b;
 color:white;
 font-family:Arial,sans-serif;
}
header{text-align:center;margin-bottom:20px}
h1{color:#a58bff;margin:5px}
.subtitle{color:#999;font-size:13px}
.panel{
 background:#1c1d2b;
 border:1px solid #333449;
 border-radius:15px;
 padding:15px;
 margin-bottom:15px;
}
label{
 display:block;
 margin:12px 0 7px;
 color:#c9c6dc;
}
select,input,button{
 width:100%;
 padding:12px;
 border-radius:9px;
 border:1px solid #414258;
 background:#292a3d;
 color:white;
 font-size:15px;
}
input[type=color]{height:45px;padding:4px}
input[type=range]{
 padding:0;
 accent-color:#987bff;
}
button{
 background:linear-gradient(120deg,#7959ed,#a15cf5);
 border:0;
 font-weight:bold;
 margin-top:10px;
}
button.secondary{background:#34354b}
button.danger{background:#a53d58}
.canvas-wrap{
 display:flex;
 justify-content:center;
 background:#151624;
 border-radius:12px;
 padding:10px;
}
canvas{
 width:100%;
 max-width:340px;
 aspect-ratio:1;
 background:#202132;
 border:2px solid #55516e;
 border-radius:5px;
 touch-action:none;
}
.row{display:flex;gap:10px}
.row>*{flex:1}
small{color:#999}
</style>
</head>
<body>
<header>
<h1>GD SKIN STUDIO</h1>
<div class="subtitle">Geometry Dash Skin Editor</div>
</header>

<div class="panel">
<h3>Настройки скина</h3>

<label>Игровой режим</label>
<select id="mode">
<option>Cube</option>
<option>Ship</option>
<option>Ball</option>
<option>UFO</option>
<option>Wave</option>
<option>Robot</option>
<option>Spider</option>
<option>Swing</option>
</select>

<label>Цвет кисти</label>
<input type="color" id="color" value="#9c72ff">

<label>Размер кисти: <span id="sizeText">8</span></label>
<input type="range" id="size" min="1" max="32" value="8">

<label>Оригинальный скин для ориентира</label>
<input type="file" id="reference" accept="image/*">

<label>Прозрачность: <span id="opacityText">35%</span></label>
<input type="range" id="opacity" min="0" max="100" value="35">
</div>

<div class="panel">
<h3>Редактор</h3>
<div class="canvas-wrap">
<canvas id="canvas" width="320" height="320"></canvas>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const color=document.getElementById("color");
const size=document.getElementById("size");
const opacity=document.getElementById("opacity");
const reference=document.getElementById("reference");

let drawing=false;
let erase=false;
let refImage=null;

function position(e){
 const rect=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-rect.left)*320/rect.width,
  y:(e.clientY-rect.top)*320/rect.height
 };
}

function start(e){
 drawing=true;
 canvas.setPointerCapture(e.pointerId);
 const p=position(e);
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
}

function move(e){
 if(!drawing)return;
 const p=position(e);

 ctx.lineWidth=Number(size.value);
 ctx.lineCap="round";
 ctx.lineJoin="round";

 if(erase){
  ctx.globalCompositeOperation="destination-out";
 }else{
  ctx.globalCompositeOperation="source-over";
  ctx.strokeStyle=color.value;
 }

 ctx.lineTo(p.x,p.y);
 ctx.stroke();
}

function stop(){
 drawing=false;
 ctx.closePath();
 ctx.globalCompositeOperation="source-over";
}

canvas.addEventListener("pointerdown",start);
canvas.addEventListener("pointermove",move);
canvas.addEventListener("pointerup",stop);
canvas.addEventListener("pointercancel",stop);

size.addEventListener("input",()=>{
 document.getElementById("sizeText").textContent=size.value;
});

reference.addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{
  const img=new Image();

  img.onload=()=>{
   refImage=img;
   redraw();
  };

  img.src=reader.result;
 };

 reader.readAsDataURL(file);
});

function redraw(){
 ctx.clearRect(0,0,320,320);

 if(refImage){
  ctx.save();
  ctx.globalAlpha=Number(opacity.value)/100;
  ctx.drawImage(refImage,0,0,320,320);
  ctx.restore();
 }
}

<div class="row">
<button class="secondary" id="eraser">Ластик</button>
<button class="secondary" id="brush">Кисть</button>
</div>

<div class="row">
<button class="danger" id="clear">Очистить</button>
<button id="save">Скачать PNG</button>
</div>
</div>

opacity.addEventListener("input",()=>{
 document.getElementById("opacityText").textContent=
 opacity.value+"%";
 redraw();
});

document.getElementById("eraser").onclick=()=>{
 erase=true;
};

document.getElementById("brush").onclick=()=>{
 erase=false;
};

document.getElementById("clear").onclick=()=>{
 ctx.clearRect(0,0,320,320);
 redraw();
};

document.getElementById("save").onclick=()=>{
 const output=document.createElement("canvas");
 output.width=320;
 output.height=320;

 output.getContext("2d").drawImage(canvas,0,0);

 const link=document.createElement("a");
 link.download="GD-Skin-"+
 document.getElementById("mode").value+".png";

 link.href=output.toDataURL("image/png");
 link.click();
};

</script>
</body>
</html>
